name: PrintDesk verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend formatting, unit/integration and package
        run: mvn -B -f backend/pom.xml spotless:check clean package
      - name: Frontend formatting, lint, tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run format:check
          npm run lint
          npm test
          npm run build
      - name: Public-source verification
        run: |
          python3 scripts/release-check.py
          git diff --check
      - name: Fresh MySQL workflow and restart
        run: |
          python3 scripts/init-env.py
          docker compose -p printdesk-ci config --quiet
          docker compose -p printdesk-ci up -d --build --wait --wait-timeout 240
          python3 scripts/quality.py --base http://127.0.0.1:8143
          docker compose -p printdesk-ci restart backend
          docker compose -p printdesk-ci up -d --wait --wait-timeout 180
          python3 scripts/verify-persistence.py --base http://127.0.0.1:8143
          python3 scripts/release-check.py
      - name: Remove only this CI project
        if: always()
        run: docker compose -p printdesk-ci down -v --remove-orphans
